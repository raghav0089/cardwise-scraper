# Seed list of Indian card issuers with the listing pages where they publish
# their card portfolio. The scraper visits `list_urls` first, harvests every
# product detail link, then scrapes those detail pages for full benefits.
# Add an issuer here when a new bank/neobank launches a card programme.

issuers:

  # ---------- Private banks ----------
  - id: hdfc
    name: HDFC Bank
    type: bank
    list_urls:
      - https://www.hdfcbank.com/personal/pay/cards/credit-cards
      - https://www.hdfcbank.com/personal/pay/cards/debit-cards
      - https://www.hdfcbank.com/personal/pay/cards/business-credit-card
    detail_link_pattern: "/personal/pay/cards/.*-card"

  - id: icici
    name: ICICI Bank
    type: bank
    list_urls:
      - https://www.icicibank.com/personal-banking/cards/consumer-cards/credit-card
      - https://www.icicibank.com/personal-banking/cards/consumer-cards/debit-card
    detail_link_pattern: "/credit-card/|/debit-card/"

  - id: axis
    name: Axis Bank
    type: bank
    list_urls:
      - https://www.axisbank.com/retail/cards/credit-card
      - https://www.axisbank.com/retail/cards/debit-card
    detail_link_pattern: "/retail/cards/"

  - id: sbi_card
    name: SBI Card
    type: bank
    list_urls:
      - https://www.sbicard.com/en/personal/credit-cards.page
    detail_link_pattern: "/credit-cards/.*\\.page$"

  - id: kotak
    name: Kotak Mahindra Bank
    type: bank
    list_urls:
      - https://www.kotak.com/en/personal-banking/cards/credit-cards.html
      - https://www.kotak.com/en/personal-banking/cards/debit-cards.html


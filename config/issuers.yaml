# Seed list of Indian card issuers with the listing pages where they publish
# their card portfolio. The scraper visits `list_urls` first, harvests every
# product detail link, then scrapes those detail pages for full benefits.
# Add an issuer here when a new bank/neobank launches a card programme.

issuers:

  # ---------- Private banks ----------
  - id: hdfc
    name: HDFC Bank
    type: bank
    list_urls:
      # New site (hdfc.bank.in) — flat listing, all cards visible, no JS tabs
      - https://www.hdfc.bank.in/credit-cards
      - https://www.hdfc.bank.in/debit-cards
      # Legacy site (hdfcbank.com) — kept as supplementary source
      - https://www.hdfcbank.com/personal/pay/cards/credit-cards
      - https://www.hdfcbank.com/personal/pay/cards/debit-cards
      - https://www.hdfcbank.com/personal/pay/cards/business-credit-card
    # Matches detail pages on both domains
    detail_link_pattern: "(/personal/pay/cards/.*-card|/credit-cards/[a-z0-9]|/debit-cards/[a-z0-9])"

  - id: icici
    name: ICICI Bank
    type: bank
    list_urls:
      - https://www.icicibank.com/personal-banking/cards/credit-card
      - https://www.icicibank.com/personal-banking/cards/consumer-cards/credit-card
      - https://www.icicibank.com/personal-banking/cards/consumer-cards/debit-card
    detail_link_pattern: "/credit-card/|/debit-card/"

  - id: axis
    name: Axis Bank
    type: bank
    list_urls:
      # New website (axis.bank.in) — category pages cover all card types
      - https://www.axis.bank.in/cards/credit-card?category=Shop
      - https://www.axis.bank.in/cards/credit-card?category=Travel
      - https://www.axis.bank.in/cards/credit-card?category=Dine
      - https://www.axis.bank.in/cards/credit-card?category=Fuel
      - https://www.axis.bank.in/cards/credit-card?category=Miles
      - https://www.axis.bank.in/cards/credit-card?category=Cashback
      - https://www.axis.bank.in/cards/credit-card
      - https://www.axis.bank.in/cards/debit-card
    detail_link_pattern: "/cards/(credit|debit)-card/"

  - id: sbi_card
    name: SBI Card
    type: bank
    list_urls:
      - https://www.sbicard.com/en/personal/credit-cards.page
      # Category listing pages to ensure all cards are discovered
      - https://www.sbicard.com/en/personal/credit-cards/lifestyle.page
      - https://www.sbicard.com/en/personal/credit-cards/rewards.page
      - https://www.sbicard.com/en/personal/credit-cards/travel.page
      - https://www.sbicard.com/en/personal/credit-cards/cashback.page
      - https://www.sbicard.com/en/personal/credit-cards/fuel.page
      - https://www.sbicard.com/en/personal/credit-cards/shopping.page
    detail_link_pattern: "/credit-cards/.*\\.page$"


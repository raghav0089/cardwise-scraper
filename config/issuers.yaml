# Seed list of Indian card issuers with the listing pages where they publish
# their card portfolio. The scraper visits `list_urls` first, harvests every
# product detail link, then scrapes those detail pages for full benefits.
# Add an issuer here when a new bank/neobank launches a card programme.

issuers:

  # ---------- Private banks ----------
  - id: hdfc
    name: HDFC Bank
    type: bank
    # Sitemap gives all card product pages directly — avoids JS-rendered listing pages
    sitemap_url: "https://www.hdfc.bank.in/sitemap.xml"
    # HDFC publishes cards across 3 sections: /credit-cards, /commercial-credit-cards
    # (corporate), and /business-credit-cards (the Biz* SME series).
    list_urls:
      # hdfc.bank.in is the canonical domain (hdfcbank.com redirects here)
      - https://www.hdfc.bank.in/credit-cards
      - https://www.hdfc.bank.in/debit-cards
      - https://www.hdfc.bank.in/business-credit-cards
    # Matches individual card product pages across all three sections
    detail_link_pattern: "^https://www\\.hdfc\\.bank\\.in/(credit-cards|debit-cards|commercial-credit-cards|business-credit-cards)/[a-z0-9][a-z0-9-]+-card$"
    # Some HDFC cards keep the full fee schedule on a dedicated sub-page — fetch & merge
    # (verified: marriott-bonvoy ₹3,000, diners-club-black ₹10,000 + ₹8L waiver)
    supplement_suffixes:
      - /fees-and-charges

  - id: icici
    name: ICICI Bank
    type: bank
    list_urls:
      - https://www.icici.bank.in/personal-banking/cards/credit-card
    detail_link_pattern: "icici\\.bank\\.in/personal-banking/cards/credit-card/[a-z]"

  - id: axis
    name: Axis Bank
    type: bank
    # Sitemap gives all individual card product pages directly
    sitemap_url: "https://www.axis.bank.in/sitemap-english.xml"
    list_urls: []
    detail_link_pattern: "axis\\.bank\\.in/cards/(credit|debit)-card/[a-z]"

  - id: sbi_card
    name: SBI Card
    type: bank
    # Sitemap has 200+ .html card pages (the .page extension URLs are 404)
    sitemap_url: "https://www.sbicard.com/sitemap.xml"
    list_urls: []
    detail_link_pattern: "sbicard\\.com/en/personal/credit-cards/.*\\.html$"

  - id: kotak
    name: Kotak Mahindra Bank
    type: bank
    # sitemap-personalbanking.xml has 60+ individual credit/debit card product pages
    sitemap_url: "https://www.kotak.bank.in/sitemap-personalbanking.xml"
    list_urls: []
    detail_link_pattern: "kotak\\.bank\\.in/en/personal-banking/cards/(credit|debit)-cards/[a-z][a-z0-9-]+\\.html$"

  - id: idfc_first
    name: IDFC FIRST Bank
    type: bank

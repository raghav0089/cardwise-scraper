name: Card Scraper

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM IST daily (2:30 AM UTC)
  workflow_dispatch:
    inputs:
      test_urls:
        description: "Smoke test (10 hardcoded URLs only)"
        type: boolean
        default: false
      test_run:
        description: "Number of issuer URLs to process (0 = full run)"
        type: number
        default: 0

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:       ap-south-1
          DDB_CARDS_TABLE:  ${{ secrets.DDB_CARDS_TABLE }}
          DDB_SOURCES_TABLE: ${{ secrets.DDB_SOURCES_TABLE }}
          S3_BUCKET:        ${{ secrets.S3_BUCKET }}
          TEST_URLS:        ${{ inputs.test_urls && '1' || '0' }}
          TEST_RUN:         ${{ inputs.test_run || '0' }}
        run: python -m src.main

      - name: Upload cards.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          path: out/cards.json
          if-no-files-found: warn
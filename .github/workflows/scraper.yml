name: Card Scraper

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM IST daily (2:30 AM UTC)
  workflow_dispatch:
    inputs:
      test_urls:
        description: "Smoke test — full discovery for HDFC, Axis, SBI Card, ICICI, Kotak, IndusInd only (~150 URLs)"
        type: boolean
        default: false
      test_run:
        description: "Cap total URLs processed (0 = no limit, e.g. 100 = first 100 across all issuers)"
        type: number
        default: 0
      max_cards:
        description: "Stop after extracting N cards (0 = no limit)"
        type: number
        default: 0
      force_refresh:
        description: "Bypass SHA cache and re-extract all pages (also purges invalid DDB records)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:        ap-south-1
          DDB_CARDS_TABLE:   cards_master
          DDB_SOURCES_TABLE: cards_sources
          S3_BUCKET:         ${{ secrets.S3_BUCKET }}
          TEST_URLS:        ${{ inputs.test_urls && '1' || '0' }}
          TEST_RUN:         ${{ inputs.test_run || '0' }}
          MAX_CARDS:        ${{ inputs.max_cards || '0' }}
          FORCE_REFRESH:    ${{ inputs.force_refresh && '1' || '0' }}
        run: python -m src.main

      - name: Upload cards.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          path: out/cards.json
          if-no-files-found: warn